<VirtualHost *:80>
    ServerName socket.apache.test
    DocumentRoot /app
    <Directory "/app">
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch "\.(php|html|htm)$">
        SetHandler "proxy:unix:/run/php-fpm/socket.apache.test.sock|fcgi://localhost/"
    </FilesMatch>
</VirtualHost>
